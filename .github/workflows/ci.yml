name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token for every job; nothing here writes to the repo.
permissions:
  contents: read

# One run per PR (or branch); a new push to a PR cancels its older run.
# Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Third-party actions are pinned to full commit SHAs (tag in the comment).
jobs:
  web:
    name: web (npm ci, typecheck, lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes scripts/check-mod-source-sync.test.mjs.
      - run: npm test
      # `npm run build` = vite build && npm run db:migrate. With DATABASE_URL
      # unset, scripts/migrate.mjs logs a skip and exits 0, so CI never touches
      # a database. `env -u` keeps it unset even if one is ever configured.
      - name: npm run build (DATABASE_URL unset, migrations skipped)
        run: env -u DATABASE_URL npm run build

  mod:
    name: mod (gradle wrapper validation, ./gradlew build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            worldforge-mod/*.gradle
            worldforge-mod/gradle.properties
            worldforge-mod/gradle/wrapper/gradle-wrapper.properties
      - name: ./gradlew build
        working-directory: worldforge-mod
        run: ./gradlew build --no-daemon
      - name: Check the jar was produced
        working-directory: worldforge-mod
        run: ls -l build/libs/worldforge-0.4.0.jar

  audit:
    name: audit (npm audit --audit-level=high)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: nothing is installed here, `npm audit` reads package-lock.json.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high

  secrets:
    name: secrets (gitleaks, full history + working tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
      # gitleaks_8.30.1_checksums.txt (also the GitHub asset digest).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for every branch and tag, so gitleaks sees all commits
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # gitleaks 8.30.1 always loads ./.gitleaksignore, which silently drops
      # findings by fingerprint. Exceptions belong in the reviewed .gitleaks.toml,
      # so fail if one is tracked anywhere (":(glob)**/" also matches the root).
      - name: Fail if a .gitleaksignore is tracked
        run: |
          set -euo pipefail
          offending="$(git ls-files -- ':(glob)**/.gitleaksignore')"
          if [ -n "$offending" ]; then
            echo "::error title=Tracked .gitleaksignore::.gitleaksignore files would suppress gitleaks findings; remove them and put exceptions in .gitleaks.toml:"
            while IFS= read -r file; do
              echo "::error file=${file}::tracked .gitleaksignore: ${file}"
            done <<< "$offending"
            exit 1
          fi
          echo "No .gitleaksignore tracked."
      # Both scans use .gitleaks.toml (default rules + one narrow allowlist entry),
      # open archives (zips, incl. ones committed then deleted) and ignore inline
      # `gitleaks:allow` comments, so only .gitleaks.toml can allow a finding.
      - name: Scan git history (including files inside committed zips)
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose --max-archive-depth 2 --ignore-gitleaks-allow .'
      - name: Scan working tree (including files inside the zips)
        run: '"$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --verbose --max-archive-depth 2 --ignore-gitleaks-allow .'

  mod-source-sync:
    name: mod-source sync (worldforge-mod/, 0.4.0 zip, MOD_SOURCE)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The check uses only Node built-ins, so no npm ci and no cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm run check:mod-source -- --verbose
